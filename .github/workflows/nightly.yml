name: nightly-pipeline

on:
  schedule:
    # 09:00 London, matching the Dagster schedule this replaces.
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DAGSTER_HOME: ${{ github.workspace }}/dagster_home
      DBT_TARGET: neon
      DBT_PROFILES_DIR: ${{ github.workspace }}/pipeline_nba/ci
      STORAGE: local
      # LocalStorage writes under PARENT_BUCKET, DBService reads FILE_PATH_PARENT_NAME.
      # They must agree or the load finds no parquet.
      PARENT_BUCKET: nba-ua-dev-bucket
      FILE_PATH_PARENT_NAME: nba-ua-dev-bucket
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      # Without this, stats.nba.com blackholes the runner and latest_nba_data times out.
      NBA_PROXY: ${{ secrets.NBA_PROXY }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LLM_DB_USER: ${{ secrets.LLM_DB_USER }}
      LLM_DB_PASSWORD: ${{ secrets.LLM_DB_PASSWORD }}
      PGHOST: ${{ secrets.PGHOST }}
      PGUSER: ${{ secrets.PGUSER }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      PGDATABASE: ${{ secrets.PGDATABASE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip

      # mysqlclient builds from source and needs the client headers.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends default-libmysqlclient-dev pkg-config

      - run: pip install -r requirements.txt

      - run: mkdir -p "$DAGSTER_HOME"

      # Must precede the first dbt build: dbt's on-run-end grants to llm_readonly,
      # which migration 0014 is what creates.
      - run: python backend/src/manage.py migrate

      # One job on purpose. latest_nba_data writes parquet to the workspace and
      # postgres_raw_tables reads it back off local disk, so splitting these across
      # jobs loses the handoff.
      - run: dagster job execute -f dagster/definitions.py -d dagster -j nightly_pipeline
