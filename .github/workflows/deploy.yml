name: deploy-api

on:
  push:
    branches: [main]
    # The frontend is built and deployed by Cloudflare Pages, not here.
    paths:
      - 'backend/**'
      - 'dagster/**'
      - 'pipeline_nba/**'
      - 'requirements.txt'
      - 'Dockerfile'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: nba-api
          source: .
          region: europe-west2
          flags: --memory=2Gi --cpu=2 --timeout=900 --allow-unauthenticated
