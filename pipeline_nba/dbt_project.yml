
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'nba_project'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'nba_project'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the example/
# directory as views. These settings can be overridden in the individual model
# files using the `{{ config(...) }}` macro.
models:
  nba_project:
    # Config indicated by + and applies to all files under models/example/
    staging:
      +schema: staging        # → your_project.dbt_dev_staging
      +materialized: view
    intermediate:
      +schema: intermediate   # → your_project.dbt_dev_intermediate
      +materialized: view
    marts:
      +schema: marts          # → your_project.dbt_dev_marts
      +materialized: table
    semantic_views:
      +schema: analytics      # → nba_analytics, following the same nba_<schema> naming
                               # dbt's default generate_schema_name macro already applies to marts
      +materialized: view
      # views get redefined (not dropped/recreated) on every run, but a one-off GRANT would
      # still be lost on the first `dbt run` after this schema is created - dbt re-applies
      # this config's grants after every run instead, so it always stays current. Requires
      # the llm_readonly role to already exist (see the 0014_llm_roles Django migration).
      +grants:
        select: ['llm_readonly']

# dbt's +grants config only grants on the views/tables themselves, not on the schema that
# contains them - without USAGE, SELECT still fails with "permission denied for schema".
on-run-end:
  - "GRANT USAGE ON SCHEMA nba_analytics TO llm_readonly"